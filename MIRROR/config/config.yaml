# Relative paths resolve from the project root.
# Local overrides belong in an ignored config/*.local.yaml file.

# Runtime settings.
seed: 2025
start_lr: 0.0003
Epoch: 800
batch_size: 4
NUM_CLASSES: 2
weight_decay: 0.001
workers: 0
initial_checkpoint: null

# Feature dimensions.
D_WSI: 1024
N: 500
RNAseq: 12042

# Input locations and configurable source labels.
clinical_csv: data/clinical.csv
rna_csv: data/rna_expression.csv
source_a_label: SOURCE_A
source_b_label: SOURCE_B
source_c_label: SOURCE_C
source_d_label: SOURCE_D
partition_01_label: PARTITION_01
partition_02_label: PARTITION_02
partition_03_label: PARTITION_03
partition_04_label: PARTITION_04
partition_05_label: PARTITION_05
partition_06_label: PARTITION_06
wsi_feature_dir_source_a: data/wsi/source_a
wsi_feature_dir_source_b: data/wsi/source_b
wsi_feature_dir_source_c: data/wsi/source_c
wsi_feature_dir_source_d: data/wsi/source_d
patient_id_column: null
participant_id_pattern: null
out_dir: results

# Objective weights and reporting interval.
w_cls: 1.0
w_uni: 0.1
w_align: 0.1
eval_every: 10

# Feature caching.
use_wsi_cache: true
wsi_cache_dir: cache/wsi_features
wsi_cache_max_patches: 2000
rebuild_wsi_cache: false

# Optional slide-image locations.
wsi_dir: null
wsi_path_source_a: null
wsi_path_source_b: null
wsi_path_source_c: null
wsi_path_source_d: null
